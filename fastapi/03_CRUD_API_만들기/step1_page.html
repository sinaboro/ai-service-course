<!DOCTYPE html>
<!-- 6-1단계 화면: 자바스크립트 없이 HTML 태그만 쓴 가장 단순한 페이지 -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 정보 (글자 인코딩, 탭 제목, 디자인) -->
  <meta charset="UTF-8">
  <title>1단계 - HTML 페이지</title>
  <style>
    /* style: 글자 모양·색·간격을 정하는 CSS (HTML·CSS 과정에서 자세히) */
    body { font-family: "Malgun Gothic", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .box { background: #eef4fb; border-left: 4px solid #2e75b6; padding: 10px 14px; }
    code { color: #c7254e; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <h1>안녕하세요, 첫 웹 페이지예요</h1>
  <p>이 화면은 FastAPI 서버가 <b>step1_page.html</b> 파일을 그대로 보내 준 거예요.</p>

  <h2>주소마다 돌려주는 것이 달라요</h2>
  <ul>
    <!-- a 태그: 누르면 그 주소로 이동하는 링크 -->
    <li><a href="/api/hello">/api/hello</a> — 데이터(JSON)를 돌려줘요</li>
    <li><a href="/inline">/inline</a> — 코드 안에 쓴 HTML 을 돌려줘요</li>
    <li><a href="/docs">/docs</a> — API 문서 (이 페이지 주소 "/" 는 문서에 없어요)</li>
  </ul>

  <div class="box">
    다음 단계에서는 이 페이지에 <b>버튼</b>을 달고, 버튼을 누르면 자바스크립트가
    <code>/api/...</code> 주소로 요청을 보내 받은 데이터를 화면에 보여 줘요.
  </div>
</body>
</html>
