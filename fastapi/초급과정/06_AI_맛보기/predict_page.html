<!DOCTYPE html>
<!-- 6장 합격 예측 화면: 4장 3단계(POST 보내기)와 같은 방법으로 /predict 를 불러요 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>합격 예측</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 10px 0 4px; }
    input { padding: 8px; font-size: 15px; width: 120px; }
    button { margin-top: 14px; padding: 8px 16px; font-size: 15px; }
    #result { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 18px; min-height: 24px; }
    .pass { background: #e2f0d9; color: #385723; }
    .fail { background: #fce4d6; color: #843c0c; }
  </style>
</head>
<body>
  <h1>AI 합격 예측</h1>
  <p>하루 생활 시간을 넣으면, 학습한 모델이 합격 확률을 알려 줘요.</p>

  <form id="predict-form">
    <label>공부 시간 <input id="study" type="number" step="0.5" value="4"></label>
    <label>수면 시간 <input id="sleep" type="number" step="0.5" value="7"></label>
    <label>휴대폰 시간 <input id="phone" type="number" step="0.5" value="2"></label>
    <button type="submit">예측하기</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById("predict-form").onsubmit = async (event) => {
      event.preventDefault();                                   // 페이지 새로고침 막기
      // 입력 칸의 값(글자) → 숫자로 바꿔 JSON 본문 만들기
      const body = {
        study_h: Number(document.getElementById("study").value),
        sleep_h: Number(document.getElementById("sleep").value),
        phone_h: Number(document.getElementById("phone").value),
      };
      // POST /predict 요청 보내기
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      const box = document.getElementById("result");
      if (res.ok) {
        const percent = (data.probability * 100).toFixed(1);        // 0.932 → "93.2"
        box.className = data.label === "합격" ? "pass" : "fail";
        box.textContent = `합격 확률 ${percent}% → ${data.label}`;
      } else {
        box.className = "fail";                                    // 422: 범위를 벗어난 값
        box.textContent = `입력 확인: ${data.detail[0].loc.at(-1)} — ${data.detail[0].msg}`;
      }
    };
  </script>
</body>
</html>
