<!DOCTYPE html>
<!-- 4장 2단계 화면: 버튼 → fetch 로 API 호출 → 받은 JSON 을 화면에 표시 + 동기/비동기 체험 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2단계 - fetch 와 비동기</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    section { background: #f5f7fb; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
    h2 { font-size: 17px; margin: 4px 0 10px; }
    button { padding: 6px 12px; font-size: 14px; margin: 2px 4px 2px 0; }
    input { padding: 6px; font-size: 14px; width: 120px; }
    .result { margin-top: 8px; min-height: 22px; color: #1f4e79; font-weight: bold; }
    #log { background: #1e1e1e; color: #e6e6e6; font-family: Consolas, monospace; font-size: 13px;
           padding: 8px 10px; min-height: 90px; white-space: pre-line; border-radius: 6px; }
    #counter { font-size: 20px; font-weight: bold; color: #c55a11; }
  </style>
</head>
<body>
  <h1>2단계 · 버튼으로 API 부르기</h1>

  <!-- ① 가장 단순한 fetch: 버튼 → GET /api/time → 화면에 표시 -->
  <section>
    <h2>① 지금 시각 가져오기 (GET)</h2>
    <button id="time-btn">시각 가져오기</button>
    <div class="result" id="time-result"></div>
  </section>

  <!-- ② 입력값을 쿼리로 실어 보내기: GET /api/hello?name=... -->
  <section>
    <h2>② 이름 보내기 (쿼리)</h2>
    <input id="name" value="철수">
    <button id="hello-btn">인사 받기</button>
    <div class="result" id="hello-result"></div>
  </section>

  <!-- ③ 동기 vs 비동기: 기다리는 동안 화면이 멈추는지 직접 확인 -->
  <section>
    <h2>③ 동기 vs 비동기 체험</h2>
    <p>
      먼저 <b>[느린 요청]</b> 을 누르고, 응답이 올 때까지 <b>[클릭 +1]</b> 을 계속 눌러 보세요. 숫자가 올라가요(비동기).<br>
      다음에 <b>[화면 멈추기]</b> 를 누르고 [클릭 +1] 을 눌러 보세요. 2초 동안 아무 반응이 없어요(동기).
    </p>
    <button id="slow-btn">느린 요청 (2초, 비동기)</button>
    <button id="block-btn">화면 멈추기 (2초, 동기)</button>
    <button id="count-btn">클릭 +1</button>
    클릭 수: <span id="counter">0</span>
    <div id="log"></div>
  </section>

  <script>
    // ── 도우미: 화면의 로그 창에 한 줄 쓰기 (시각과 함께) ──
    function log(text) {
      const time = new Date().toLocaleTimeString();
      document.getElementById("log").textContent += `[${time}] ${text}\n`;
    }

    // ── ① 버튼 → GET 요청 ──
    // async function: 안에서 await 를 쓸 수 있는 함수
    // await: "응답이 올 때까지 이 함수만 잠깐 기다려요" — 그동안 화면(다른 버튼)은 계속 움직여요
    async function loadTime() {
      const res = await fetch("/api/time");          // 서버에 GET 요청 → 응답(Response) 받기
      const data = await res.json();                 // 응답 본문 JSON → 자바스크립트 객체
      document.getElementById("time-result").textContent = `서버 시각: ${data.now}`;
    }
    // 버튼을 눌렀을 때(onclick) 위 함수를 실행하도록 연결
    document.getElementById("time-btn").onclick = loadTime;

    // ── ② 입력값을 쿼리로 보내기 ──
    document.getElementById("hello-btn").onclick = async () => {
      const name = document.getElementById("name").value;
      // encodeURIComponent: 한글·띄어쓰기를 주소에 안전한 글자로 바꿔요 (0장 2절 URL)
      const res = await fetch(`/api/hello?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      document.getElementById("hello-result").textContent = data.message;
    };

    // ── ③-1 비동기: 느린 요청을 보내 놓고, 기다리는 동안 다른 일을 할 수 있어요 ──
    document.getElementById("slow-btn").onclick = async () => {
      log("1) 느린 요청을 보냈어요 (기다리는 동안 [클릭 +1] 을 눌러 보세요)");
      const res = await fetch("/api/slow?seconds=2");  // 여기서 이 함수만 기다리고, 화면은 계속 움직여요
      const data = await res.json();
      log(`3) 응답 도착: ${data.message}`);
    };

    // ── ③-2 동기: 자바스크립트가 2초 동안 계산만 하며 붙잡고 있으면 화면 전체가 멈춰요 ──
    document.getElementById("block-btn").onclick = () => {
      log("화면을 2초 동안 멈춰요 (이 동안 버튼이 반응하지 않아요)");
      const end = Date.now() + 2000;
      while (Date.now() < end) { }                     // 아무 일도 안 하면서 2초를 꽉 붙잡기
      log("멈춤이 풀렸어요 — 그동안 누른 클릭은 이제야 처리돼요");
    };

    // ── 클릭 수 세기: 화면이 살아 있는지 확인하는 용도 ──
    let count = 0;
    document.getElementById("count-btn").onclick = () => {
      count += 1;
      document.getElementById("counter").textContent = count;
      log(`2) 클릭 +1 → ${count}`);
    };
  </script>
</body>
</html>
