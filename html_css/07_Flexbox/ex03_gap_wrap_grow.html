<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간격 줄바꿈 크기</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; margin: 12px; }
    h2 { font-size: 16px; color: #1f4e79; margin: 14px 0 4px; }
    .row { display: flex; border: 2px dashed #2e75b6; background: #f0f7fd; padding: 4px; }
    .row p { margin: 0; padding: 8px 14px; background: #548235; color: #fff; text-align: center; }
    .gap   { gap: 12px; }
    .wrap  { flex-wrap: wrap; width: 520px; }
    .w     { width: 150px; }
    .g1    { flex: 1; }
    .g2    { flex: 2; }
    .fixed { width: 200px; flex-shrink: 0; }
  </style>
</head>
<body>
  <h2>gap: 12px — 아이템 사이 간격</h2>
  <div class="row gap"><p>A</p><p>B</p><p>C</p></div>
  <h2>flex-wrap: wrap — 넘치면 다음 줄로</h2>
  <div class="row gap wrap">
    <p class="w">1</p><p class="w">2</p><p class="w">3</p><p class="w">4</p><p class="w">5</p>
  </div>
  <h2>flex: 1 — 남은 공간을 똑같이 나누기</h2>
  <div class="row gap"><p class="g1">1</p><p class="g1">1</p><p class="g1">1</p></div>
  <h2>flex: 2 와 flex: 1 — 2 : 1 로 나누기</h2>
  <div class="row gap"><p class="g2">2</p><p class="g1">1</p></div>
  <h2>고정 + 나머지 — 왼쪽 200px, 오른쪽은 남는 만큼</h2>
  <div class="row gap"><p class="fixed">200px</p><p class="g1">flex: 1</p></div>
</body>
</html>
