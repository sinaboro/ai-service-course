<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정렬</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; margin: 12px; }
    h2 { font-size: 16px; color: #1f4e79; margin: 14px 0 4px; }
    .row { display: flex; border: 2px dashed #2e75b6; background: #f0f7fd; }
    .row p { margin: 4px; padding: 6px 18px; background: #c55a11; color: #fff; }
    .start   { justify-content: flex-start; }
    .center  { justify-content: center; }
    .between { justify-content: space-between; }
    .around  { justify-content: space-around; }
    .tall    { height: 90px; }
    .middle  { align-items: center; }
    .big     { padding: 22px 18px; }
  </style>
</head>
<body>
  <h2>justify-content: flex-start (기본)</h2>
  <div class="row start"><p>A</p><p>B</p><p>C</p></div>
  <h2>justify-content: center</h2>
  <div class="row center"><p>A</p><p>B</p><p>C</p></div>
  <h2>justify-content: space-between</h2>
  <div class="row between"><p>A</p><p>B</p><p>C</p></div>
  <h2>justify-content: space-around</h2>
  <div class="row around"><p>A</p><p>B</p><p>C</p></div>
  <h2>align-items: center (세로 가운데) — 높이가 다른 아이템</h2>
  <div class="row tall middle"><p>A</p><p class="big">B</p><p>C</p></div>
</body>
</html>
