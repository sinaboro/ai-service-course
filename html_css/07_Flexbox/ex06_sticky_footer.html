<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바닥에 붙는 footer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;          /* 최소 화면 높이만큼 */
      display: flex;
      flex-direction: column;     /* header · main · footer 를 세로로 */
      font-family: "Malgun Gothic", sans-serif;
    }
    header { background: #1f4e79; color: #fff; padding: 8px 20px; }
    header h1 { margin: 0; font-size: 20px; }
    main { flex: 1; padding: 16px 20px; }   /* ⭐ main 이 남는 높이를 다 차지 */
    footer { background: #ececec; text-align: center; padding: 8px; }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- header · main · footer 세 개가 body 의 세로 flex 아이템 -->
  <header>
    <h1>FloatWatch</h1>
  </header>
  <!-- 내용이 짧아도 main 이 늘어나서 footer 를 화면 맨 아래로 밀어요 -->
  <main>
    <p>본문이 짧아도 footer 는 화면 맨 아래에 있어요.</p>
  </main>
  <footer>
    <p>© 2026 FloatWatch 팀</p>
  </footer>
</body>
</html>
