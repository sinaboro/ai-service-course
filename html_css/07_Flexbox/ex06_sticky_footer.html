<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바닥에 붙는 footer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;          /* 최소 화면 높이만큼 */
      display: flex;
      flex-direction: column;     /* header · main · footer 를 세로로 */
      font-family: "Malgun Gothic", sans-serif;
    }
    header { background: #1f4e79; color: #fff; padding: 8px 20px; }
    header h1 { margin: 0; font-size: 20px; }
    main { flex: 1; padding: 16px 20px; }   /* ⭐ main 이 남는 높이를 다 차지 */
    footer { background: #ececec; text-align: center; padding: 8px; }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>FloatWatch</h1>
  </header>
  <main>
    <p>본문이 짧아도 footer 는 화면 맨 아래에 있어요.</p>
  </main>
  <footer>
    <p>© 2026 FloatWatch 팀</p>
  </footer>
</body>
</html>
