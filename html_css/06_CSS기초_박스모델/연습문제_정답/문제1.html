<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 카드</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; background: #f2f2f2; }
    .profile { width: 320px; margin: 30px auto; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 12px; text-align: center; }
    .profile h1 { margin: 0; font-size: 24px; color: #1f4e79; }
    .role { color: #c55a11; font-weight: bold; }
    .btn { display: inline-block; padding: 8px 16px; background: #1f4e79; color: #fff; border-radius: 6px; text-decoration: none; }
    .btn:hover { background: #2e75b6; }
  </style>
</head>
<body>
  <main>
    <article class="profile">
      <h1>이서연</h1>
      <p class="role">모델 학습 담당</p>
      <p>YOLO 학습과 성능 비교를 맡고 있어요.</p>
      <p><a class="btn" href="#">포트폴리오 보기</a></p>
    </article>
  </main>
</body>
</html>
