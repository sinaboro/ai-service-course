<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; }
    h2 { font-size: 16px; margin: 12px 0 4px; color: #1f4e79; }
    .b  { background: #ddebf7; margin: 2px 0; }
    .i  { background: #fbe5d6; width: 300px; }      /* width 가 무시돼요 */
    .ib { display: inline-block; width: 90px; padding: 6px; background: #e2efda; text-align: center; }
    .hide { display: none; }
  </style>
</head>
<body>
  <main>
    <h2>block: 한 줄을 다 차지</h2>
    <div class="b">div</div><p class="b">p</p>
    <h2>inline: 글자처럼 옆으로, width 무시</h2>
    <span class="i">span</span><a class="i" href="#">a</a><strong class="i">strong</strong>
    <h2>inline-block: 옆으로 + width 적용</h2>
    <span class="ib">버튼1</span><span class="ib">버튼2</span><span class="ib">버튼3</span>
    <h2>none: 화면에서 사라짐</h2>
    <p>아래 줄은 display: none 이라 보이지 않아요.</p>
    <p class="hide">숨겨진 줄</p>
  </main>
</body>
</html>
