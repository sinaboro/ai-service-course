<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색 글꼴 단위</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; }
    h2 { margin: 8px 0 4px; font-size: 18px; }
    p { margin: 3px 0; }
    /* 색 이름 · 16진수 · rgb · 반투명 rgb */
    .c1 { color: tomato; }
    .c2 { color: #2e75b6; }
    .c3 { color: rgb(84 130 53); }
    .c4 { background: rgb(255 0 0 / 0.15); }
    /* 굵게 · 기울임 · 줄 간격 · 가운데 정렬 · 밑줄 */
    .f1 { font-weight: bold; font-style: italic; line-height: 1.8; text-align: center; text-decoration: underline; }
    /* 단위: px 고정 / rem = 페이지 기본 글자 기준 / em = 부모 글자 기준 / % = 부모 너비 기준 */
    .u-px { font-size: 16px; }
    .u-rem { font-size: 1.5rem; }
    .u-em { font-size: 20px; }
    .u-em span { font-size: 0.8em; color: #c55a11; }
    .u-pct { width: 50%; background: #ddebf7; padding: 4px; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <main>
    <!-- 색을 쓰는 네 가지 방법 -->
    <section>
      <h2>색을 쓰는 방법</h2>
      <p class="c1">이름: tomato</p>
      <p class="c2">16진수: #2e75b6</p>
      <p class="c3">rgb: rgb(84 130 53)</p>
      <p class="c4">반투명 배경: rgb(255 0 0 / 0.15)</p>
    </section>
    <!-- 글꼴 관련 속성 다섯 가지를 한 문단에 -->
    <section>
      <h2>글꼴</h2>
      <p class="f1">굵게 · 기울임 · 줄 간격 1.8 · 가운데 정렬 · 밑줄</p>
    </section>
    <!-- 단위 비교: px, rem, em, % -->
    <section class="units">
      <h2>단위</h2>
      <p class="u-px">16px: 고정 크기</p>
      <p class="u-rem">1.5rem: 기본 글자(16px)의 1.5배 = 24px</p>
      <p class="u-em">이 상자 글자 20px · <span>안쪽 0.8em = 16px</span></p>
      <div class="u-pct">width: 50% (부모의 절반)</div>
    </section>
  </main>
</body>
</html>
