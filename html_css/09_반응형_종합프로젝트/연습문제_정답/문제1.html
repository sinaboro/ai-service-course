<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반응형 카드</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; margin: 12px; }
    .cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .cards article { background: #ddebf7; border-radius: 8px; padding: 8px 12px; }
    .cards h2 { margin: 0; font-size: 16px; }
    @media (min-width: 600px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>탐지 결과 카드</h1>
    <section class="cards" aria-label="결과 카드">
      <article><h2>beach_01</h2><p>3개</p></article>
      <article><h2>beach_02</h2><p>1개</p></article>
      <article><h2>river_01</h2><p>5개</p></article>
      <article><h2>river_02</h2><p>2개</p></article>
      <article><h2>port_01</h2><p>0개</p></article>
      <article><h2>port_02</h2><p>4개</p></article>
    </section>
  </main>
</body>
</html>
