<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레시피</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 16px; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <header>
    <p>오늘의 요리</p>
  </header>
  <main>
    <article>
      <h1>김치볶음밥</h1>
      <p>작성일 <time datetime="2026-10-04">10월 4일</time></p>
      <section>
        <h2>재료</h2>
        <ul><li>밥</li><li>김치</li><li>달걀</li></ul>
      </section>
      <section>
        <h2>만드는 법</h2>
        <ol><li>김치를 볶아요.</li><li>밥을 넣고 섞어요.</li><li>달걀을 올려요.</li></ol>
      </section>
    </article>
  </main>
  <footer>
    <p>© 2026 요리 블로그</p>
  </footer>
</body>
</html>
