<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가장 흔한 화면 구도</title>
  <style>
    /* 화면 구도 확인용: 시맨틱 태그마다 색 + 태그 이름표 */
    body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 12px; background: #f4f6f8; font-size: 15px; }
    /* 시맨틱 태그 9개에 점선 테두리 + 안쪽 여백 (위쪽은 이름표 자리) */
    header, nav, main, section, article, aside, footer, figure, search {
      position: relative; border: 2px dashed; border-radius: 8px;
      padding: 26px 12px 10px; margin: 6px 0;
    }
    /* ::before 로 왼쪽 위에 "<태그이름>" 이름표 붙이기 */
    header::before, nav::before, main::before, section::before, article::before,
    aside::before, footer::before, figure::before, search::before {
      position: absolute; top: 3px; left: 8px; font: bold 12px Consolas, monospace;
    }
    /* 태그마다 다른 색: 테두리 색 · 배경색 · 이름표 글자 */
    header  { border-color: #1f4e79; background: #dfe9f5; }  header::before  { content: "<header>"; color: #1f4e79; }
    nav     { border-color: #7030a0; background: #efe3f7; }  nav::before     { content: "<nav>"; color: #7030a0; }
    main    { border-color: #c00000; background: #fff; }     main::before    { content: "<main>"; color: #c00000; }
    section { border-color: #2e75b6; background: #f0f7fd; }  section::before { content: "<section>"; color: #2e75b6; }
    article { border-color: #548235; background: #eef7e8; }  article::before { content: "<article>"; color: #548235; }
    aside   { border-color: #bf8f00; background: #fff6d9; }  aside::before   { content: "<aside>"; color: #bf8f00; }
    footer  { border-color: #595959; background: #ececec; }  footer::before  { content: "<footer>"; color: #595959; }
    figure  { border-color: #c55a11; background: #fdeee4; margin: 6px 0; }  figure::before { content: "<figure>"; color: #c55a11; }
    search  { border-color: #00808a; background: #e2f4f5; display: block; }  search::before { content: "<search>"; color: #00808a; }
    h1, h2, h3, p { margin: 4px 0; }
    /* 메뉴 목록은 가로로 */
    nav ul { list-style: none; display: flex; gap: 14px; margin: 0; padding: 0; }
    /* 구도를 보기 쉽게: main 과 aside 를 3 : 1 너비로 나란히 */
    .cols { display: flex; gap: 12px; }
    .cols main { flex: 3; }
    .cols aside { flex: 1; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- header: 사이트 맨 위 (로고 + 메뉴) -->
  <header>
    <p><strong>로고</strong></p>
    <!-- nav: 다른 페이지로 가는 메뉴 묶음 / aria-label: 메뉴 이름 (화면 낭독기가 읽어요) -->
    <nav aria-label="주 메뉴">
      <ul><li>홈</li><li>프로젝트</li><li>문의</li></ul>
    </nav>
  </header>
  <!-- div class="cols": 뜻은 없고 main 과 aside 를 옆으로 나란히 놓기 위한 상자 -->
  <div class="cols">
    <!-- main: 이 페이지의 핵심 내용 (한 페이지에 하나) -->
    <main>
      <h1>페이지 제목</h1>
      <!-- article: 따로 떼어 내도 뜻이 통하는 글 한 편 -->
      <article>
        <h2>글 제목</h2>
        <p>글 내용</p>
      </article>
    </main>
    <!-- aside: 본문 옆의 곁가지 정보 (공지, 광고, 관련 글) -->
    <aside>
      <h2>공지</h2>
      <p>광고 · 관련 글</p>
    </aside>
  </div>
  <!-- footer: 사이트 맨 아래 (저작권, 연락처) -->
  <footer>
    <p>© 2026 AI Lab · 연락처</p>
  </footer>
</body>
</html>
