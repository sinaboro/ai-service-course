<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>div 로만 만든 페이지</title>
  <style>
    /* ex01 과 ex02 가 똑같이 보이도록 함께 쓰는 CSS: div 의 class 와 시맨틱 태그를 같은 모양으로 */
    body { font-family: "Malgun Gothic", sans-serif; margin: 0; background: #f4f6f8; }
    .header, header { background: #1f4e79; color: #fff; padding: 12px 24px; }
    .nav ul, nav ul { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; }
    .nav a, nav a { color: #ffd966; text-decoration: none; }
    .wrap { display: flex; gap: 16px; padding: 16px 24px; }
    .main, main { flex: 3; background: #fff; padding: 16px; border-radius: 8px; }
    .aside, aside { flex: 1; background: #fff8e1; padding: 16px; border-radius: 8px; }
    .footer, footer { text-align: center; color: #666; padding: 12px; }
    /* div 로 제목처럼 보이게 하려면 CSS 로 일일이 꾸며야 해요 */
    .logo { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .post-title { font-weight: bold; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- ✖ 나쁜 예: 모두 div 라서 class 이름을 읽어야만 무엇인지 알 수 있어요 -->
  <!-- 브라우저 · 검색엔진 · 화면 낭독기는 class 이름의 뜻을 몰라요 -->
  <div class="header">
    <div class="logo">AI 객체탐지 랩</div>
    <div class="nav">
      <ul>
        <li><a href="#">홈</a></li>
        <li><a href="#">프로젝트</a></li>
        <li><a href="#">문의</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap">
    <div class="main">
      <!-- 제목처럼 보이지만 h1 이 아니라서 "제목"으로 인식되지 않아요 -->
      <div class="title">이번 주 프로젝트</div>
      <div class="post">
        <div class="post-title">해양 부유물 탐지</div>
        <div>YOLO 로 바다 위 쓰레기를 찾는 모델을 만들었어요.</div>
      </div>
    </div>
    <div class="aside">
      <div class="title">공지</div>
      <div>금요일 발표가 있어요.</div>
    </div>
  </div>
  <div class="footer">© 2026 AI Lab</div>
</body>
</html>
