<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>section 과 article</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section, article { border: 2px solid; border-radius: 8px; padding: 4px 14px; margin: 10px 0; }
    section { border-color: #2e75b6; }
    article { border-color: #70ad47; background: #f4fbef; }
    h1 { margin: 0 0 8px; }
    h2, h3 { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <h1>AI 수업 블로그</h1>

    <section>
      <h2>최신 글</h2>
      <article>
        <h3>labelImg 설치하기</h3>
        <p>윈도우에서 압축을 풀고 labelImg.exe 를 실행해요.</p>
      </article>
      <article>
        <h3>YOLO 첫 학습</h3>
        <p>에폭 30 번 만에 mAP 0.7 을 넘겼어요.</p>
      </article>
    </section>

    <section>
      <h2>인기 태그</h2>
      <ul>
        <li>OpenCV</li>
        <li>Keras</li>
      </ul>
    </section>

    <article>
      <h2>프로젝트 회고</h2>
      <section>
        <h3>잘한 점</h3>
        <p>레이블링 기준을 팀이 먼저 정했어요.</p>
      </section>
      <section>
        <h3>아쉬운 점</h3>
        <p>밤 사진이 부족했어요.</p>
      </section>
    </article>
  </main>
</body>
</html>
