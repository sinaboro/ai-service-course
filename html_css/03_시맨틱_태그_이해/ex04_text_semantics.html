<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의미를 담은 태그들</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    figure { margin: 10px 0; }
    figcaption { color: #555; font-size: 14px; }
    blockquote { border-left: 4px solid #2e75b6; margin: 10px 0; padding-left: 12px; color: #333; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <main>
    <h1>탐지 결과 리포트</h1>
    <!-- time: 날짜 · 시간. datetime 에 컴퓨터가 읽는 형식(연-월-일)을 적어요 -->
    <p>작성일: <time datetime="2026-10-04">2026년 10월 4일</time></p>

    <!-- figure: 그림 + 설명 묶음 / figcaption: 그림 설명 -->
    <figure>
      <img src="images/detect_example.svg" alt="바다 위 페트병 두 개에 상자가 그려진 탐지 결과" width="360" height="200">
      <figcaption>그림 1. 해변 사진에서 페트병 2개를 찾은 결과</figcaption>
    </figure>

    <!-- mark: 형광펜처럼 눈에 띄게 / abbr title: 줄임말과 원래 뜻 (마우스를 올리면 보여요) -->
    <p>이번 실험에서 <mark>신뢰도 0.5 이상</mark>인 결과만 남겼어요.
      <abbr title="mean Average Precision">mAP</abbr> 은 0.74 였어요.</p>

    <!-- blockquote: 다른 곳에서 가져온 인용문 / cite: 출처 주소 -->
    <blockquote cite="https://docs.ultralytics.com">
      <p>데이터의 품질이 모델의 품질을 결정한다.</p>
    </blockquote>

    <!-- details + summary: 눌러서 펼치는 접기 상자 -->
    <details>
      <summary>실험 설정 자세히 보기</summary>
      <p>yolo11n, 이미지 크기 640, 에폭 50</p>
    </details>

    <!-- address: 연락처 정보 / mailto: 누르면 메일 프로그램이 열려요 -->
    <address>문의: <a href="mailto:ailab@example.com">ailab@example.com</a></address>
  </main>
</body>
</html>
