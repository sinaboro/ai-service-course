<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 웹 페이지</title>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- h1: 이 페이지에서 가장 큰(가장 중요한) 제목 -->
  <h1>안녕하세요, HTML!</h1>
  <!-- p: 문단 하나 -->
  <p>이것은 나의 첫 번째 웹 페이지입니다.</p>
</body>
</html>
