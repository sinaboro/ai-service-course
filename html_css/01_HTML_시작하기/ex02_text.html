<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제목과 문단</title>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- h1: 페이지 전체 제목 (보통 한 페이지에 하나) -->
  <h1>인공지능 수업 소개</h1>
  <!-- h2: 큰 단원 제목 / strong: 중요한 말, em: 강조해서 읽는 말 -->
  <h2>1. 수업 목표</h2>
  <p>파이썬으로 데이터를 분석하고, <strong>딥러닝 모델</strong>을 만들어 <em>웹 서비스</em>로 배포합니다.</p>
  <h2>2. 수업 순서</h2>
  <p>파이썬 기초 → 데이터 분석 → 딥러닝 → 객체 탐지 → 웹 서비스</p>
  <!-- h3: h2 아래의 작은 단원 제목 (h1 → h2 → h3 순서로) -->
  <h3>2-1. 준비물</h3>
  <!-- br: 문단 안에서 줄만 바꾸기 -->
  <p>노트북, 열정,<br>그리고 꾸준함</p>
  <!-- hr: 주제가 바뀌는 곳의 구분선 / small: 작은 글씨의 덧붙임 말 -->
  <hr>
  <p><small>※ 일정은 사정에 따라 바뀔 수 있어요.</small></p>
</body>
</html>
