<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주석과 개발자 도구</title>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- 주석: 브라우저 화면에는 보이지 않아요 -->
  <h1>개발자 도구로 살펴보기</h1>
  <!-- kbd: 키보드 키, code: 코드 조각 -->
  <p>키보드 <kbd>F12</kbd> 를 누르고 <code>Elements</code> 탭을 열어 보세요.</p>
  <!-- <p>이 문단은 주석 처리되어 보이지 않아요.</p> -->
  <!-- 문자 참조: < 는 &lt;, > 는 &gt;, & 는 &amp;, © 는 &copy;, 띄어쓰기 칸은 &nbsp; -->
  <p>특수 문자: &lt;태그&gt; &amp; &copy; 2026 &nbsp;&nbsp; 띄어쓰기 여러 칸</p>
</body>
</html>
