<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 업로드</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; }
    label { display: inline-block; width: 110px; }
  </style>
</head>
<body>
  <h1>객체 탐지해 보기</h1>
  <form action="/detect" method="post" enctype="multipart/form-data">
    <p>
      <label for="image">사진 선택</label>
      <input type="file" id="image" name="file" accept="image/png, image/jpeg" required>
    </p>
    <p>
      <label for="conf">신뢰도 기준</label>
      <input type="number" id="conf" name="conf" min="0.1" max="0.9" step="0.05" value="0.25">
    </p>
    <button type="submit">탐지 시작</button>
  </form>
</body>
</html>
