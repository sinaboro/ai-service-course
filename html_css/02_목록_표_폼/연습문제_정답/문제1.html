<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시간표</title>
  <style>
    /* 모든 예제에 공통으로 쓰는 글꼴과 여백 (CSS 는 6장에서 자세히 배워요) */
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; }
    th, td { border: 1px solid #999; padding: 6px 12px; }
    table { border-collapse: collapse; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <h1>주간 시간표</h1>
  <table>
    <caption>3주차 시간표</caption>
    <thead>
      <tr><th scope="col">시간</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th></tr>
    </thead>
    <tbody>
      <tr><th scope="row">1교시</th><td>파이썬</td><td>판다스</td><td rowspan="2">프로젝트</td></tr>
      <tr><th scope="row">2교시</th><td>넘파이</td><td>시각화</td></tr>
    </tbody>
  </table>
</body>
</html>
