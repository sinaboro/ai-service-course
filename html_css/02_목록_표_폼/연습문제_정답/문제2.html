<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; }
  </style>
</head>
<body>
  <h1>회원가입</h1>
  <form action="/signup" method="post">
    <fieldset>
      <legend>계정</legend>
      <p><label for="uid">아이디</label> <input type="text" id="uid" name="uid" required minlength="4"></p>
      <p><label for="upw">비밀번호</label> <input type="password" id="upw" name="upw" required minlength="8"></p>
    </fieldset>
    <fieldset>
      <legend>성별</legend>
      <label><input type="radio" name="gender" value="f"> 여</label>
      <label><input type="radio" name="gender" value="m"> 남</label>
    </fieldset>
    <p><label><input type="checkbox" name="agree" required> 약관에 동의합니다</label></p>
    <button type="submit">가입</button>
  </form>
</body>
</html>
