<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>표</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; margin: 24px; }
    table { border-collapse: collapse; }

    caption { font-weight: bold; margin-bottom: 8px; }
    thead { background: #dfe9f5; }

</head>
<body>

      <tr>

        <th scope="col">mAP50</th>

      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">yolo11n</th>
        <td>50</td>
        <td>0.72</td>
        <td rowspan="2">CPU 학습</td>
      </tr>
      <tr>
        <th scope="row">yolo11s</th>

        <td>0.78</td>
      </tr>

    <tfoot>
      <tr>
        <td colspan="4">※ 실습용 예시 값이에요.</td>

</html>
