<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>areas 3단 페이지</title>
  <link rel="stylesheet" href="regions.css">
  <style>
    body {
      display: grid;
      /* 열 너비 3개: 메뉴 180px | 본문 남는 만큼 | 사이드바 200px */
      grid-template-columns: 180px 1fr 200px;
      /* 행 높이 3개: 머리글 내용만큼 | 가운데 남는 만큼 | 바닥글 내용만큼 */
      grid-template-rows: auto 1fr auto;
      /* ⭐ 구도를 글자로 그리기: 따옴표 한 쌍 = 한 줄, 단어 하나 = 칸 하나 */
      grid-template-areas:
        "header header header"
        "nav    main   aside"
        "footer footer footer";
      /* 줄 사이 · 칸 사이 간격 */
      gap: 8px;
      min-height: 420px;
    }
    header { grid-area: header; }   /* ⭐ 시맨틱 태그 ↔ 영역 이름 연결 */
    nav    { grid-area: nav; }
    main   { grid-area: main; }
    aside  { grid-area: aside; }
    footer { grid-area: footer; }
    nav ul { flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <!-- body 바로 아래 다섯 시맨틱 태그가 grid 아이템. 배치용 div 가 하나도 없어요 -->
  <header>
    <h1>AI 수업 노트</h1>
  </header>
  <nav aria-label="강의 목차">
    <ul><li><a href="#">1. AI 개요</a></li><li><a href="#">2. 딥러닝</a></li><li><a href="#">3. YOLO</a></li></ul>
  </nav>
  <main>
    <article>
      <h2>3. YOLO 학습하기</h2>
      <p>data.yaml 을 만들고 model.train() 을 실행해요.</p>
    </article>
  </main>
  <aside aria-label="참고 자료">
    <h2>참고</h2>
    <p>Ultralytics 문서</p>
  </aside>
  <footer>
    <p>© 2026 AI 수업 노트</p>
  </footer>
</body>
</html>
