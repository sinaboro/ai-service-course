<!DOCTYPE html>
<!-- 이 문서는 HTML5 문서예요 (항상 맨 첫 줄) -->
<html lang="ko">
<head>
  <!-- head: 화면에 보이지 않는 문서 정보 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자동 카드 갤러리</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; margin: 16px; background: #f5f7fa; }
    h1 { font-size: 22px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);   /* ⭐ 같은 너비 칸 4개 → 사진 7장이면 2줄이 돼요 */
      gap: 14px;
    }
    /* 갤러리 칸: 흰 카드 모양 */
    .gallery figure { margin: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
    .gallery img { width: 100%; height: auto; display: block; border-radius: 4px; }
    .gallery figcaption { font-size: 13px; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <!-- body: 화면에 보이는 내용 -->
  <main>
    <h1>탐지 결과 갤러리</h1>
    <!-- 결과 사진 묶음 = section, 사진 한 장 = figure(그림 + 설명) -->
    <section class="gallery" aria-label="결과 사진">
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 1" width="160" height="100"><figcaption>beach_01.jpg · 3개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 2" width="160" height="100"><figcaption>beach_02.jpg · 1개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 3" width="160" height="100"><figcaption>river_01.jpg · 5개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 4" width="160" height="100"><figcaption>river_02.jpg · 2개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 5" width="160" height="100"><figcaption>port_01.jpg · 0개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 6" width="160" height="100"><figcaption>port_02.jpg · 4개</figcaption></figure>
      <figure><img src="images/thumb.svg" alt="병 탐지 결과 7" width="160" height="100"><figcaption>lake_01.jpg · 2개</figcaption></figure>
    </section>
  </main>
</body>
</html>
