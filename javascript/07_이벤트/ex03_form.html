<!DOCTYPE html>
<!-- ex03_form.html : 폼 제출 막고 목록에 더하기 (동작 코드는 짝 파일 ex03_form.js)
     Go Live 로 열면 결과가 화면에 나와요. console.log 결과는 F12 → Console 에서 봐요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폼 제출 막고 목록에 더하기</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex03_form.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->
</head>
<body>
  <h1>장보기 목록</h1>
  <form id="add-form">
    <label for="item">살 것</label>
    <input id="item" name="item" placeholder="예: 우유">
    <button type="submit">추가</button>
  </form>
  <p id="message"></p>
  <ul id="list" class="list"></ul>
</body>
</html>
