<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글자 수 세기</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex02_input.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->

  <textarea id="intro" rows="3" cols="50" placeholder="30자 이내로 소개해 주세요"></textarea>
  <p id="counter">0 / 30</p>
</body>
</html>
