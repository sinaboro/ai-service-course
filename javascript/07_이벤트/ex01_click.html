<!DOCTYPE html>
<!-- ex01_click.html : 클릭 카운터 (동작 코드는 짝 파일 ex01_click.js)
     Go Live 로 열면 결과가 화면에 나와요. console.log 결과는 F12 → Console 에서 봐요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클릭 카운터</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex01_click.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->
</head>
<body>
  <h1>클릭 카운터</h1>
  <p class="box">지금 숫자: <strong id="num">0</strong></p>
  <button id="plus">+1</button>
  <button id="minus" class="ghost">-1</button>
  <button id="reset" class="ghost">처음으로</button>
</body>
</html>
