<!DOCTYPE html>
<!-- ex04_todo.html : 할 일 목록 만들기 (동작 코드는 짝 파일 ex04_todo.js)
     Go Live 로 열면 결과가 화면에 나와요. console.log 결과는 F12 → Console 에서 봐요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록 만들기</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex04_todo.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->
</head>
<body>
  <h1>할 일 목록</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="할 일을 입력하세요" aria-label="할 일">
    <button type="submit">추가</button>
  </form>
  <ul id="todo-list" class="list"></ul>
  <p id="left"></p>
</body>
</html>
