<!DOCTYPE html>
<!-- ex03_guestbook.html : 방명록 (동작 코드는 짝 파일 ex03_guestbook.js)
     서버로 열어요: 09_FastAPI와_통신 폴더에서 uvicorn main:app --reload → http://127.0.0.1:8000/ex03_guestbook.html -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방명록</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex03_guestbook.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->
</head>
<body>
  <h1>방명록</h1>
  <form id="msg-form" class="row">
    <input name="name" id="name" placeholder="이름 (10자 이내)" aria-label="이름" size="12">
    <input name="text" id="text" placeholder="남길 말 (100자 이내)" aria-label="남길 말">
    <button type="submit">등록</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
</body>
</html>
