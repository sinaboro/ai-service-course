<!DOCTYPE html>
<!-- ex02_class.html : class 로 모양 바꾸기 (동작 코드는 짝 파일 ex02_class.js)
     Go Live 로 열면 결과가 화면에 나와요. console.log 결과는 F12 → Console 에서 봐요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>class 로 모양 바꾸기</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->
  <script src="ex02_class.js" defer></script>  <!-- defer: HTML 을 다 읽은 뒤에 JS 실행 -->
</head>
<body>
  <h1>class 로 모양 바꾸기</h1>
  <div class="box" id="notice">공지: 내일은 휴강이에요</div>
  <p id="secret" class="hidden">숨어 있던 문단이 나타났어요!</p>
  <p id="status"></p>
</body>
</html>
