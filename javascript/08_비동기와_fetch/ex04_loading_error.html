<!DOCTYPE html>
<!-- ex04_loading_error.html : 로딩 표시와 오류 처리 (동작 코드는 짝 파일 ex04_loading_error.js)

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로딩 표시와 오류 처리</title>
  <link rel="stylesheet" href="style.css">  <!-- 화면 꾸미기(CSS) 파일 연결 -->

</head>
<body>
  <h1>로딩 표시와 오류 처리</h1>

  <button id="bad-btn" class="ghost">없는 파일 불러오기</button>
  <p id="status"></p>
  <ul id="members" class="list"></ul>
</body>
</html>
