<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 JavaScript</title>
</head>
<body>
  <h1>첫 JavaScript</h1>
  <p>F12 를 눌러 <b>Console</b> 탭을 열어 보세요.</p>

  <!-- script 태그 안에 JavaScript 를 써요. body 맨 아래에 두면 HTML 을 다 읽은 뒤에 실행돼요 -->
  <script>
    // console.log(): 괄호 안의 값을 Console 탭에 출력해요 (파이썬의 print 와 같은 역할)
    console.log("안녕하세요, JavaScript!");
    console.log(1 + 2);            // 계산 결과 3 이 출력돼요
    console.log("1 + 2 =", 1 + 2); // 쉼표로 여러 값을 한 줄에 출력
  </script>
</body>
</html>
